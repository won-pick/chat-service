spring.application.name=chat-server
server.port=${PORT:8080}

# Local MySQL by default. The connector creates chat_db; schema.sql creates missing tables.
spring.datasource.url=${CHAT_DB_URL:jdbc:mysql://localhost:3306/chat_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${CHAT_DB_USER:root}
spring.datasource.password=${CHAT_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
